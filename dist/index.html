<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Merge Empire is a soft pastel icon merge game with guest play, cloud saves, missions, upgrades, and leaderboards."
    />
    <meta name="theme-color" content="#fff8fd" />
    <meta property="og:title" content="Merge Empire" />
    <meta
      property="og:description"
      content="Build a soft cloud icon empire by merging tiny smiles into larger rewards."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-BI71Q6yf.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@600;700;800;900&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <script src="./data/supabaseConfig.js"></script>
    <script src="./data/stripeConfig.js"></script>
    <title>Merge Empire</title>
    <script type="module" crossorigin src="./assets/index-VYVSpj3M.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHA_gU5j.css">
  </head>
  <body>
    <div id="root">
      <div class="app-shell static-shell">
        <header class="topbar">
          <div class="wordmark" aria-label="Merge Empire">
            <span class="wordmark__main">Merge</span>
            <span class="wordmark__accent">Empire</span>
          </div>
          <div class="profile-chip">Guest founder</div>
        </header>
        <main class="main-layout">
          <section class="hero-copy" aria-labelledby="static-hero-title">
            <div class="eyebrow">Soft cloud icon merge game</div>
            <h1 id="static-hero-title">Merge Empire</h1>
            <p class="hero-lede">
              Combine tiny smiles into bigger icons, bank idle revenue, clear missions, and climb the empire board.
            </p>
            <dl class="hero-metrics">
              <div>
                <dt>Net worth</dt>
                <dd>1.2K</dd>
              </div>
              <div>
                <dt>Highest icon</dt>
                <dd>2</dd>
              </div>
              <div>
                <dt>Mergers</dt>
                <dd>0</dd>
              </div>
            </dl>
          </section>
          <section class="board-panel static-board-panel" aria-label="Preview board">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">Operating board</p>
                <h2>Merge icons</h2>
              </div>
              <div class="level-badge">Level 1</div>
            </div>
            <div class="merge-board static-board" aria-label="Static Merge Empire board preview">
              <span class="static-cell cell-bubble">
                <span class="static-tile static-tile-cyan shape-bubble">
                  <img class="static-icon" src="./assets/smile-6n2UclIy.png" alt="" />
                </span>
              </span>
              <span class="static-cell cell-circle">
                <span class="static-tile static-tile-pink shape-circle">
                  <img class="static-icon" src="./assets/happy-face-zi4NmJwF.png" alt="" />
                </span>
              </span>
              <span class="static-cell cell-pill"></span>
              <span class="static-cell cell-drop"></span>
              <span class="static-cell cell-cloud">
                <span class="static-tile static-tile-gold shape-drop">
                  <img class="static-icon" src="./assets/starry-eyes-Ct3caWiT.png" alt="" />
                </span>
              </span>
              <span class="static-cell cell-gem"></span>
              <span class="static-cell cell-bubble">
                <span class="static-tile static-tile-mint shape-flower">
                  <img class="static-icon" src="./assets/love-eyes-Bp71Hkmm.png" alt="" />
                </span>
              </span>
              <span class="static-cell cell-circle"></span>
              <span class="static-cell cell-pill"></span>
              <span class="static-cell cell-drop"></span>
              <span class="static-cell cell-cloud"></span>
              <span class="static-cell cell-gem"></span>
              <span class="static-cell cell-bubble">
                <span class="static-tile static-tile-violet shape-pill">
                  <img class="static-icon" src="./assets/party-face-D3EoYvsz.png" alt="" />
                </span>
              </span>
              <span class="static-cell cell-circle"></span>
              <span class="static-cell cell-pill"></span>
              <span class="static-cell cell-drop"></span>
              <span class="static-cell cell-cloud"></span>
              <span class="static-cell cell-gem"></span>
              <span class="static-cell cell-bubble"></span>
              <span class="static-cell cell-circle"></span>
              <span class="static-cell cell-pill"></span>
              <span class="static-cell cell-drop"></span>
              <span class="static-cell cell-cloud"></span>
              <span class="static-cell cell-gem"></span>
              <span class="static-cell cell-bubble"></span>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
